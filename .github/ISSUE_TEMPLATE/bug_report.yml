name: Bug report
description: "Reproduce a problem with debt direction, clearing payments and conservation certificates."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or appropriately licensed public inputs. Do not attach private records or credentials.
        Suspected vulnerabilities: follow [SECURITY.md](https://github.com/dev-belly/NetworkClear/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or full commit
      description: Include the installed package version and source revision when known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or API call
      description: Include the working directory assumptions and exact options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible input and steps
      description: "A small synthetic network and one scenario; retain the direction of each debt and positive outside debts."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: "Include the shock, exact expected payment or conservation identity and actual certificate/verification result. Clearing rounds are computation steps."
    validations:
      required: true
