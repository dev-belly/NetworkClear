name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Style
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit and integration contracts
        run: python -m unittest discover -s tests -v
      - name: Replay committed evidence
        run: |
          python scripts/check_demo.py
          networkclear verify examples/demo
          python scripts/generate_preview.py --check
      - name: Installed wheel outside checkout
        run: |
          python -m pip wheel . --no-deps -w /tmp/wheelhouse
          python -m venv /tmp/networkclear-wheel
          /tmp/networkclear-wheel/bin/python -m pip install --no-deps /tmp/wheelhouse/*.whl
          cd /tmp
          /tmp/networkclear-wheel/bin/networkclear demo --out /tmp/wheel-demo
          /tmp/networkclear-wheel/bin/networkclear verify /tmp/wheel-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-python-${{ matrix.python }}
          path: examples/demo

  windows:
    name: Windows Python 3.12
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows checkout conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Style
        run: |
          ruff check src tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff format --check src tests scripts
      - name: Unit and integration contracts
        env:
          PYTHONUTF8: "0"
        run: python -m unittest discover -s tests -v
      - name: Replay committed evidence
        run: |
          python scripts/check_demo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          networkclear verify examples/demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_preview.py --check
      - name: Installed wheel outside checkout
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'networkclear-wheelhouse'
          $wheelEnv = Join-Path $env:RUNNER_TEMP 'networkclear-wheel'
          $wheelDemo = Join-Path $env:RUNNER_TEMP 'networkclear-wheel-demo'
          python -m pip wheel . --no-deps --wheel-dir $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv $wheelEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelPython = Join-Path $wheelEnv 'Scripts/python.exe'
          $wheelCli = Join-Path $wheelEnv 'Scripts/networkclear.exe'
          $wheels = @(Get-ChildItem -LiteralPath $wheelhouse -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one wheel' }
          & $wheelPython -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            & $wheelCli demo --out $wheelDemo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $wheelCli verify $wheelDemo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

  deploy:
    name: Deploy verified demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/demo
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
