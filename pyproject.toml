[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "networkclear"
version = "0.1.0"
description = "Exact clearing, counterparty contagion and independently verified stress reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dev-belly"}]
dependencies = []

[project.scripts]
networkclear = "networkclear.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.11.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
networkclear = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
